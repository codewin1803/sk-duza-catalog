<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SK Duza Price Catalog & Calculator</title>
  <style>
    :root {
      --primary: #047857;
      --primary-light: #10b981;
      --primary-accent: #ecfdf5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent-red: #dc2626;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 14px -2px rgba(0,0,0,0.08);
      --shadow-lg: 0 10px 25px -5px rgba(4, 120, 87, 0.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-dark);
      margin: 0;
      padding: 12px;
      -webkit-font-smoothing: antialiased;
    }

    header {
      text-align: center;
      padding: 16px 12px;
      background: linear-gradient(135deg, #065f46 0%, #047857 100%);
      border-radius: 16px;
      color: #ffffff;
      margin-bottom: 20px;
      box-shadow: var(--shadow-lg);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34d399;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #a7f3d0;
      margin-top: 2px;
      font-weight: 400;
    }

    #loading {
      text-align: center;
      padding: 40px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .feed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      max-width: 850px;
      margin: 0 auto 100px auto;
    }

    .feed-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .feed-card:focus-within, .feed-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary-light);
    }

    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 8px;
    }

    .feed-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 0;
      color: var(--text-dark);
      line-height: 1.3;
    }

    .price-badge {
      background-color: var(--primary-accent);
      color: var(--primary);
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .updated-date {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .calc-section {
      background-color: #f8fafc;
      border-radius: 10px;
      padding: 10px;
      border: 1px solid #f1f5f9;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      font-weight: 600;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      background: #ffffff;
      color: var(--text-dark);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.15);
    }

    .total-box {
      margin-top: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed #e2e8f0;
      padding-top: 8px;
    }

    .total-amount {
      color: var(--accent-red);
      font-size: 1rem;
      font-weight: 800;
    }

    /* Floating Bottom Dock for Grand Total */
    .grand-total-bar {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 820px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      z-index: 1000;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .grand-total-label {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .grand-total-amount {
      color: #34d399;
      font-size: 1.25rem;
      font-weight: 800;
    }

    @media (max-width: 340px) {
      body { padding: 6px; }
      header { padding: 12px 8px; border-radius: 12px; }
      h1 { font-size: 1.1rem; }
      .feed-card { padding: 12px; border-radius: 10px; }
      .price-badge { font-size: 0.85rem; }
      .grand-total-bar {
        bottom: 6px;
        padding: 8px 12px;
        border-radius: 10px;
        width: calc(100% - 12px);
      }
      .grand-total-amount { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-badge">
      <span class="status-dot"></span>
      Live Sheet Sync
    </div>
    <h1>SK DUZA ENTERPRISES</h1>
    <div class="sub-title">Feed Catalog & Live Order Calculator</div>
  </header>

  <div id="loading">Syncing Latest Feed Prices...</div>
  <div id="feed-container" class="feed-grid"></div>

  <!-- Floating Grand Total Summary Bar -->
  <div class="grand-total-bar">
    <span class="grand-total-label">Grand Total:</span>
    <span class="grand-total-amount" id="grand-total">₦0</span>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzx0OreTpR7nowiE15Kc1ilv5E7C4GdOaxti2mEgCx_ptCV1W5k-lBjV7e4sJ-DimwY/exec";
    let catalogData = [];

    async function loadCatalog() {
      try {
        const response = await fetch(API_URL);
        catalogData = await response.json();
        
        const container = document.getElementById("feed-container");
        const loading = document.getElementById("loading");
        
        loading.style.display = "none";
        container.innerHTML = "";

        catalogData.forEach((item, index) => {
          // Flexible key grabbers to prevent "Unknown Feed" or ₦0 errors due to casing/spacing
          const keys = Object.keys(item);
          const feedName = item[keys[0]] || "Unknown Feed";
          
          let rawPrice = item[keys[1]] !== undefined ? item[keys[1]] : 0;
          const unitPrice = parseFloat(String(rawPrice).replace(/[^0-9.]/g, '')) || 0;
          
          const lastUpdated = item[keys[2]] ? new Date(item[keys[2]]).toLocaleDateString() : "Recently";

          const card = document.createElement("div");
          card.className = "feed-card";
          card.innerHTML = `
            <div class="feed-header">
              <h2 class="feed-title">${feedName}</h2>
              <span class="price-badge">₦${unitPrice.toLocaleString()}</span>
            </div>
            <div class="updated-date">Updated: ${lastUpdated}</div>
            <div class="calc-section">
              <label for="qty-${index}">Quantity (Bags)</label>
              <input type="number" id="qty-${index}" min="0" placeholder="0" data-price="${unitPrice}" oninput="updateCalculations()">
              <div class="total-box">
                <span>Subtotal:</span>
                <span class="total-amount" id="total-${index}">₦0</span>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        document.getElementById("loading").innerText = "Unable to fetch live prices. Please check connection.";
        console.error("Error fetching data:", error);
      }
    }

    function updateCalculations() {
      let grandTotal = 0;

      catalogData.forEach((item, index) => {
        const qtyInput = document.getElementById(`qty-${index}`);
        if (!qtyInput) return;

        const unitPrice = parseFloat(qtyInput.getAttribute("data-price")) || 0;
        const quantity = parseFloat(qtyInput.value) || 0;
        
        const itemTotal = quantity * unitPrice;
        grandTotal += itemTotal;

        const totalElement = document.getElementById(`total-${index}`);
        if (totalElement) {
          totalElement.innerText = `₦${itemTotal.toLocaleString()}`;
        }
      });

      document.getElementById("grand-total").innerText = `₦${grandTotal.toLocaleString()}`;
    }

    loadCatalog();
  </script>
</body>
</html>
