<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SK Duza Price Catalog & Calculator</title>
  <style>
    :root {
      --primary: #047857;
      --primary-light: #10b981;
      --primary-accent: #ecfdf5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent-red: #dc2626;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 14px -2px rgba(0,0,0,0.08);
      --shadow-lg: 0 10px 25px -5px rgba(4, 120, 87, 0.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-dark);
      margin: 0;
      padding: 12px;
      -webkit-font-smoothing: antialiased;
    }

    header {
      text-align: center;
      padding: 16px 12px;
      background: linear-gradient(135deg, #065f46 0%, #047857 100%);
      border-radius: 16px;
      color: #ffffff;
      margin: 0 auto 20px auto;
      max-width: 720px;
      box-shadow: var(--shadow-lg);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34d399;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #a7f3d0;
      margin-top: 2px;
      font-weight: 400;
    }

    #loading {
      text-align: center;
      padding: 40px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .main-container {
      max-width: 720px;
      margin: 0 auto 110px auto;
      display: none;
    }

    .step-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .step-badge {
      background: var(--primary-accent);
      color: var(--primary);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .location-surcharge-tag {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary);
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 11px 12px;
      font-size: 0.98rem;
      font-weight: 600;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      background: #ffffff;
      color: var(--text-dark);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    select:focus, input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.15);
    }

    select:disabled, input:disabled {
      background-color: #f1f5f9;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .locked-notice {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 14px;
      text-align: center;
    }

    .order-item-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      margin-bottom: 12px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .order-item-card:focus-within, .order-item-card:hover {
      border-color: var(--primary-light);
      box-shadow: var(--shadow-md);
    }

    .item-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .item-number {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .remove-btn {
      background: #fee2e2;
      color: var(--accent-red);
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .remove-btn:hover {
      background: #fecaca;
    }

    .item-controls {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    @media (max-width: 480px) {
      .item-controls {
        grid-template-columns: 1fr;
      }
    }

    .price-breakdown {
      background: #f8fafc;
      border-radius: 10px;
      padding: 10px 12px;
      border: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .unit-price-info {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .unit-price-info strong {
      color: var(--primary);
      font-size: 0.92rem;
    }

    .subtotal-info {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .subtotal-amount {
      color: var(--accent-red);
      font-size: 1.05rem;
      font-weight: 800;
      margin-left: 4px;
    }

    .add-product-btn {
      width: 100%;
      padding: 13px 16px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .add-product-btn:hover:not(:disabled) {
      background: #065f46;
    }

    .add-product-btn:disabled {
      background: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Floating Bottom Dock for Grand Total */
    .grand-total-bar {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 720px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      z-index: 1000;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .grand-total-label {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .grand-total-sub {
      display: block;
      font-size: 0.72rem;
      color: #64748b;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
    }

    .grand-total-amount {
      color: #34d399;
      font-size: 1.25rem;
      font-weight: 800;
    }

    @media (max-width: 340px) {
      body { padding: 6px; }
      header { padding: 12px 8px; border-radius: 12px; }
      h1 { font-size: 1.1rem; }
      .grand-total-bar {
        bottom: 6px;
        padding: 8px 12px;
        border-radius: 10px;
        width: calc(100% - 12px);
      }
      .grand-total-amount { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-badge">
      <span class="status-dot"></span>
      Live Sheet Sync
    </div>
    <h1>SK DUZA ENTERPRISES</h1>
    <div class="sub-title">Feed Catalog & Live Order Calculator</div>
  </header>

  <div id="loading">Syncing Latest Feed Prices...</div>

  <div id="main-app" class="main-container">
    <!-- STEP 1: LOCATION SELECTOR -->
    <div class="step-card">
      <div class="step-header">
        <span class="step-badge">Step 1: Delivery Location</span>
        <span class="location-surcharge-tag" id="location-fee-badge">Required</span>
      </div>
      <label for="location-select">Select Destination Location</label>
      <select id="location-select" onchange="handleLocationChange()">
        <option value="">-- Choose a Location First --</option>
        <option value="jos" data-fee="495" data-name="Jos, Plateau State">Jos, Plateau State (+₦495 / bag)</option>
        <option value="lafia" data-fee="495" data-name="Lafia, Nasarawa State">Lafia, Nasarawa State (+₦495 / bag)</option>
        <option value="bauchi" data-fee="565" data-name="Bauchi">Bauchi (+₦565 / bag)</option>
      </select>
    </div>

    <!-- LOCK NOTICE BEFORE LOCATION IS CHOSEN -->
    <div id="lock-notice" class="locked-notice">
      Please select a delivery location above before selecting products.
    </div>

    <!-- STEP 2: DYNAMIC PRODUCT ROWS -->
    <div id="order-rows-container"></div>

    <button type="button" id="add-product-btn" class="add-product-btn" onclick="addProductRow()" disabled>
      + Add Another Product
    </button>
  </div>

  <!-- Floating Grand Total Summary Bar -->
  <div class="grand-total-bar">
    <div>
      <span class="grand-total-label">Grand Total</span>
      <span class="grand-total-sub" id="summary-location-text">No location selected</span>
    </div>
    <span class="grand-total-amount" id="grand-total">₦0</span>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzx0OreTpR7nowiE15Kc1ilv5E7C4GdOaxti2mEgCx_ptCV1W5k-lBjV7e4sJ-DimwY/exec";
    let productsList = [];
    let currentLocationFee = 0;
    let isLocationSelected = false;
    let rowCounter = 0;

    async function loadCatalog() {
      try {
        const response = await fetch(API_URL);
        const rawData = await response.json();

        productsList = rawData.map((item, idx) => {
          const keys = Object.keys(item);
          const feedName = item[keys[0]] || `Feed Item ${idx + 1}`;
          const rawPrice = item[keys[1]] !== undefined ? item[keys[1]] : 0;
          const basePrice = parseFloat(String(rawPrice).replace(/[^0-9.]/g, '')) || 0;
          const lastUpdated = item[keys[2]] ? new Date(item[keys[2]]).toLocaleDateString() : "Recently";

          return {
            id: idx,
            name: feedName,
            basePrice: basePrice,
            lastUpdated: lastUpdated
          };
        });

        document.getElementById("loading").style.display = "none";
        document.getElementById("main-app").style.display = "block";

        // Create the first product row (locked until location is selected)
        addProductRow();
      } catch (error) {
        document.getElementById("loading").innerText = "Unable to fetch live prices. Please check connection.";
        console.error("Error fetching data:", error);
      }
    }

    function handleLocationChange() {
      const locationSelect = document.getElementById("location-select");
      const selectedOption = locationSelect.options[locationSelect.selectedIndex];
      const lockNotice = document.getElementById("lock-notice");
      const addBtn = document.getElementById("add-product-btn");
      const feeBadge = document.getElementById("location-fee-badge");
      const summaryLocationText = document.getElementById("summary-location-text");

      if (!locationSelect.value) {
        isLocationSelected = false;
        currentLocationFee = 0;
        lockNotice.style.display = "block";
        addBtn.disabled = true;
        feeBadge.innerText = "Required";
        summaryLocationText.innerText = "No location selected";
      } else {
        isLocationSelected = true;
        currentLocationFee = parseFloat(selectedOption.getAttribute("data-fee")) || 0;
        const locName = selectedOption.getAttribute("data-name");

        lockNotice.style.display = "none";
        addBtn.disabled = false;
        feeBadge.innerText = `+₦${currentLocationFee.toLocaleString()} / bag`;
        summaryLocationText.innerText = `${locName} (+₦${currentLocationFee.toLocaleString()}/bag)`;
      }

      refreshAllRows();
    }

    function buildProductOptionsHTML(selectedProductId) {
      let options = `<option value="">-- Select a Feed Product --</option>`;
      productsList.forEach(prod => {
        const finalBagPrice = prod.basePrice + currentLocationFee;
        const selectedAttr = String(prod.id) === String(selectedProductId) ? "selected" : "";
        options += `<option value="${prod.id}" ${selectedAttr}>${prod.name} — ₦${finalBagPrice.toLocaleString()}/bag</option>`;
      });
      return options;
    }

    function addProductRow() {
      rowCounter++;
      const rowId = rowCounter;
      const container = document.getElementById("order-rows-container");

      const rowDiv = document.createElement("div");
      rowDiv.className = "order-item-card";
      rowDiv.id = `order-row-${rowId}`;
      rowDiv.setAttribute("data-row-id", rowId);

      const disabledAttr = isLocationSelected ? "" : "disabled";

      rowDiv.innerHTML = `
        <div class="item-top-bar">
          <span class="item-number">Product Item</span>
          <button type="button" class="remove-btn" onclick="removeProductRow(${rowId})">Remove</button>
        </div>
        <div class="item-controls">
          <div>
            <label for="product-select-${rowId}">Select Feed</label>
            <select id="product-select-${rowId}" onchange="updateCalculations()" ${disabledAttr}>
              ${buildProductOptionsHTML("")}
            </select>
          </div>
          <div>
            <label for="qty-input-${rowId}">Quantity (Bags)</label>
            <input type="number" id="qty-input-${rowId}" min="0" placeholder="0" oninput="updateCalculations()" ${disabledAttr}>
          </div>
        </div>
        <div class="price-breakdown">
          <span class="unit-price-info">Final Bag Price: <strong id="unit-price-${rowId}">₦0</strong></span>
          <span class="subtotal-info">Subtotal: <span class="subtotal-amount" id="subtotal-${rowId}">₦0</span></span>
        </div>
      `;

      container.appendChild(rowDiv);
      updateRowNumbers();
      updateCalculations();
    }

    function removeProductRow(rowId) {
      const container = document.getElementById("order-rows-container");
      if (container.children.length <= 1) {
        // Reset the single remaining row instead of deleting all rows
        document.getElementById(`product-select-${rowId}`).value = "";
        document.getElementById(`qty-input-${rowId}`).value = "";
        updateCalculations();
        return;
      }

      const rowEl = document.getElementById(`order-row-${rowId}`);
      if (rowEl) {
        rowEl.remove();
      }
      updateRowNumbers();
      updateCalculations();
    }

    function updateRowNumbers() {
      const rows = document.querySelectorAll(".order-item-card");
      rows.forEach((row, idx) => {
        const label = row.querySelector(".item-number");
        if (label) {
          label.innerText = `Product #${idx + 1}`;
        }
      });
    }

    function refreshAllRows() {
      const rows = document.querySelectorAll(".order-item-card");
      rows.forEach(row => {
        const rowId = row.getAttribute("data-row-id");
        const selectEl = document.getElementById(`product-select-${rowId}`);
        const qtyEl = document.getElementById(`qty-input-${rowId}`);

        const currentSelection = selectEl.value;
        selectEl.innerHTML = buildProductOptionsHTML(currentSelection);

        selectEl.disabled = !isLocationSelected;
        qtyEl.disabled = !isLocationSelected;
      });

      updateCalculations();
    }

    function updateCalculations() {
      let grandTotal = 0;
      const rows = document.querySelectorAll(".order-item-card");

      rows.forEach(row => {
        const rowId = row.getAttribute("data-row-id");
        const selectEl = document.getElementById(`product-select-${rowId}`);
        const qtyEl = document.getElementById(`qty-input-${rowId}`);
        const unitPriceEl = document.getElementById(`unit-price-${rowId}`);
        const subtotalEl = document.getElementById(`subtotal-${rowId}`);

        if (!isLocationSelected || selectEl.value === "") {
          unitPriceEl.innerText = "₦0";
          subtotalEl.innerText = "₦0";
          return;
        }

        const product = productsList.find(p => String(p.id) === String(selectEl.value));
        const basePrice = product ? product.basePrice : 0;
        const finalBagPrice = basePrice + currentLocationFee;
        const quantity = parseFloat(qtyEl.value) || 0;
        const itemSubtotal = finalBagPrice * quantity;

        unitPriceEl.innerText = `₦${finalBagPrice.toLocaleString()}`;
        subtotalEl.innerText = `₦${itemSubtotal.toLocaleString()}`;
        grandTotal += itemSubtotal;
      });

      document.getElementById("grand-total").innerText = `₦${grandTotal.toLocaleString()}`;
    }

    loadCatalog();
  </script>
</body>
</html>
